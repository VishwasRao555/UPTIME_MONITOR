# Fallback when the Railway service Root Directory is left at the repo root.
# Prefer setting Root Directory to "server" in the dashboard — that uses
# server/railway.json instead and installs only the API's dependencies.
#
# Without one of those, Nixpacks would run the root package.json "start"
# script (local dev: API + Vite), which never binds $PORT for the healthcheck.

[build]
builder = "NIXPACKS"
# Enter server/ when present (repo-root deploys), then npm ci next to the
# lockfile. `npm --prefix server ci` fails on Railway's npm with EUSAGE even
# though server/package-lock.json exists — ci must run with cwd = server.
buildCommand = "sh -c 'if [ -f server/package-lock.json ]; then cd server; fi; npm ci --omit=dev'"

[deploy]
startCommand = "sh -c 'if [ -f server/package.json ]; then cd server; fi; npm start'"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
